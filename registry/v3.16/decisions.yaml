  - id: OD-021
    status: RESOLVED
    note: Bir TripRequest en fazla bir Trip; Trip ilk plan değişikliğinde tembel oluşur ve TripRequest'e kalıcı başvurur; uçuş/konaklama seçimleri TripRequest'te kalır. Traveler.trip_id hedefi Trip.
  - id: OD-027
    status: RESOLVED
    note: 'İlk değişiklik If-None-Match: * ile Trip + revision 1; sonrakiler If-Match "<version>"; stale 409 RC-CONFLICT-REVISION-STALE; Idempotency-Key revision''a kalıcı bağlı; outbox aynı transaction.'
  - id: ADR-010
    status: PARTIALLY_RESOLVED
    note: 'Kimlik doğrulama RESOLVED (2026-10-07): genel OIDC, tek yapılandırılmış issuer, Bearer JWT, principal = (iss, sub), token ömrü ve hesap kurtarma issuer''da. OPEN: ASVS seviyesi, secret yönetimi, SBOM, ayrıcalıklı erişim logu, internal adminOAuth.'
