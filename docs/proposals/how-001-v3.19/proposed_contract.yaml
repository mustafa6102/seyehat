permissions:
  resource: TripRequest.CurrentPlanRevision.ItineraryItem.ContextualGuide
  owner:
    read: PROPOSED_ALLOW
    refresh: PROPOSED_ALLOW
  collaborator: PROPOSED_DENY
  anonymous: DENY
  evaluation_order: [AUTHN_401, RESOURCE_404, OWNER_403, PRECONDITION_409, DOMAIN_422]
  refs: [PLT-AUTH-001, OD-HOW-007, OD-HOW-008]
lifecycle:
  id: TRN-HOW-EVIDENCE-01
  status: PROPOSED
  machine: VerificationStatus
  trigger: OP-refreshTripPlanItemGuide
  semantics: >-
    Reverification delegates to the approved canonical source operation. HOW does not turn UNVERIFIED evidence into FRESH.
    Success/failure and FRESH/STALE/EXPIRED/UNVERIFIED retain the source contract semantics.
  persistence: none_for_how_read_model
  plan_revision_effect: none
  outbox_effect: none
reason_error:
  reused:
    - RC-AUTHN-REQUIRED
    - RC-AUTHZ-DENIED
    - RC-RESOURCE-NOT-FOUND
    - RC-VALIDATION-SCHEMA
    - RC-CONFLICT-REVISION-STALE
    - RC-CONFLICT-IDEMPOTENCY-KEY
    - RC-EVIDENCE-STALE
  proposed:
    - id: RC-HOW-CONTEXT-UNSUPPORTED
      machine_code: HOW_CONTEXT_UNSUPPORTED
      http_status: 422
      message_tr: Bu plan öğesi için adım adım rehber henüz desteklenmiyor.
      retryable: false
    - id: RC-HOW-EVIDENCE-UNAVAILABLE
      machine_code: HOW_EVIDENCE_UNAVAILABLE
      http_status: 503
      message_tr: Bu adım için doğrulanabilir kaynak bilgisi şu anda kullanılamıyor.
      retryable: true
    - id: RC-HOW-REVERIFY-UNAVAILABLE
      machine_code: HOW_REVERIFY_UNAVAILABLE
      http_status: 503
      message_tr: Kaynak bilgisi şu anda yeniden doğrulanamadı; mevcut bilgi eski olarak gösteriliyor.
      retryable: true
config:
  - id: CFG-HOW-EVIDENCE-FRESHNESS
    status: PROPOSED_ALIAS_ONLY
    value: INHERIT_SOURCE
    note: No numeric default. Each evidence slot inherits its canonical source verification_status and expires_at.
  - id: CFG-HOW-REVERIFY-TIMEOUT
    status: PROPOSED_NOT_ADDED
    value: NOT_APPLICABLE_IF_OD-HOW-004-D1-A
    note: HOW does not define a second timeout. Reverify inherits the approved source operation resilience profile; missing profile or unavailable capability fails closed without a provider call. No numeric default.
persistence:
  provisional: COMPUTED_READ_MODEL
  stored_how_records: false
  source_of_truth: canonical_domain_snapshots
  accepts_raw_provider_payload: false
  accepts_client_asserted_facts: false
  future_schema_change: none_if_OD-HOW-006_option_A_is_approved
