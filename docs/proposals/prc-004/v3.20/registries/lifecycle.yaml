version: 3.20.0-proposal
status: PROPOSED
records:
  - id: PRC-PRICE-SNAPSHOT-LIFECYCLE-PROPOSED
    state: APPEND_ONLY_OBSERVATION
    transitions: []
    rules:
      - Snapshot observations are immutable; evaluation does not mutate them.
      - Read operation performs no provider call, PlanRevision mutation, notification or outbox write.
      - Retention duration is unresolved and no numeric TTL is proposed.
    refs: [PRC-004, FR-PRC-004-01, NFR-AUD-001, ADR-002, ADR-009, OD-013]
  - id: PRC-EVALUATION-LIFECYCLE-PROPOSED
    states: [CONFIGURATION_UNRESOLVED, INSUFFICIENT_DATA, AVAILABLE]
    rules:
      - Missing cohort, sufficiency or outlier configuration forces CONFIGURATION_UNRESOLVED.
      - AVAILABLE is unreachable until all three versioned policies are approved and present.
      - Result is a computed read model and is not persisted as a target price.
    refs: [RULE-PRC-004-01, RULE-PRC-004-02, RULE-PRC-004-03, AC-PRC-004-01, AC-PRC-004-02, AC-PRC-004-03]
