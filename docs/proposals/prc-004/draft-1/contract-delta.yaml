open_contract_details:
  canonical_fields:
    - canonical route identity and direction field references
    - canonical fare-product identifier and normalization authority
    - canonical baggage identity including unit and applicability semantics
    - whether comparison currency is observed currency only or an approved FX-normalized field
  outlier_determinism:
    - modified-z scale constant and precision
    - strict greater-than versus greater-than-or-equal threshold comparison
    - median convention for even-sized cohorts
    - whether sufficiency count and span are measured before or after exclusion
  snapshot_creation:
    - approved source operation and capture trigger
    - idempotency key/fingerprint fields and conflict behavior
    - provenance field references and provider-offer identity lifetime
  retention_and_privacy:
    - authoritative TripRequest deletion event/state
    - month-boundary/timezone calculation
    - deletion execution and verification responsibility
    - legal hold, audit exception and crypto-shredding interaction
  api:
    - active target contract version
    - productType path handling when only FLIGHT is supported
    - exact 200 response revision including comparable and excluded snapshot counts
