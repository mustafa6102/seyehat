# --- Hata / reason semantiği (yeni kod yok) ----------------------------------------------------
error_semantics:
  - case: FLEXIBLE outbound veya return tarihi
    result: arama sağlayıcıya gitmeden engellenir (mevcut journeyBlockerTr); GAP-FLT-CRITERIA-001 açık kalır
  - case: Sağlayıcı teklifinde slice sayısı/sırası/uç noktası talep ile uyuşmuyor
    result: teklif atılır (mevcut "eksik teklif tamamlanmaz" kuralı); kullanıcıya gösterilmez
  - case: Seçimde offer.journey_type != TripRequest.journey_type veya teklif bu talebin aramasından değil
    result: 409 RC-DECISION-OFFER-NOT-SELECTABLE (v3.13 mevcut kod)
  - case: Reprice sonucunda segment/yön listesi farklı
    result: "UNVERIFIED + RC-EVIDENCE-REPRICE-UNVERIFIED; seçim değişmez (D3)"
  - case: Süresi dolmuş gidiş-dönüş teklif
    result: mevcut TRN-OFFER-02 / RC-EVIDENCE-OFFER-EXPIRED; seçilemez (RULE-FLT-REPRICE-001-04)
  - case: Sağlayıcı zaman aşımı / 4xx / 5xx
    result: mevcut PLT-REL-001 ve RC-PROVIDER-TIMEOUT davranışı; yeni kod yok

# --- Duffel eşlemesi (ProviderAcl içi; dışarı sızmaz, RULE-FLT-002-01) -------------------------
provider_mapping:
  provider_id: duffel_flights
  request: "POST /air/offer_requests slices=[{origin,destination,departure_date=outbound.date},{origin=destination,destination=origin,departure_date=return.date}], passengers = mevcut ALL_ADULT politikası"
  one_request_only: true          # iki ayrı tek yön istek yapılmaz
  offer_mapping:
    offer.id: provider_offer_id (tek kimlik, tüm yönler)
    offer.slices[0].segments[*]: segments[*] direction=OUTBOUND (sağlayıcı sırası korunur)
    offer.slices[1].segments[*]: segments[*] direction=INBOUND (sağlayıcı sırası korunur)
    offer.total_amount/total_currency: price (tüm yönler + yolcular; yöne bölünmez)
    offer.expires_at: expires_at
    segment.passengers[*].baggages: baggage (A4; yalnız tüm segmentlerde aynı hak bilinen değer olur)
  drop_offer_when:
    - slice sayısı istekteki slice sayısına eşit değil
    - herhangi bir slice'ta segment yok veya segment zaman/kimlik alanı eksik
    - slice uç noktası istek ile uyuşmuyor (IATA_AIRPORT -> havalimanı kodu; IATA_CITY -> havalimanının şehir kodu; D4)
  never:
    - iki tek yön teklifi birleştirip ROUND_TRIP üretmek
    - eksik dönüşü tahmin etmek veya tamamlamak
    - Duffel tek teklifini korumalı (protected) bilet olarak etiketlemek (OD-017: kanıt yoksa UNKNOWN)
  reprice: "GET /air/offers/{provider_offer_id} aynı teklif kimliğiyle; aynı eşleme uygulanır"
  verification_note: "Duffel'in çok slice'lı teklifi tek bilet/PNR olarak düzenleyeceği bu depoda kanıtlanmamıştır; koruma iddiası yapılmaz."

