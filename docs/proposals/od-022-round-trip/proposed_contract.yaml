# --- Önerilen şema değişiklikleri -------------------------------------------------------------
schema_changes:
  - id: SCH-FlightOffer
    from: contracts/v3.4/schemas/FlightOffer.schema.json (3.4)
    to: docs/proposals/od-022-round-trip/schemas/FlightOffer.schema.json (3.23-proposal)
    decision_ref: D1
    add:
      - path: /journey_type
        type: enum [ONE_WAY, ROUND_TRIP]
        required: true
        derivation: provider offer slice count (1 -> ONE_WAY, 2 -> ROUND_TRIP); never inferred from dates
      - path: /segments/*/direction
        type: enum [OUTBOUND, INBOUND]
        required: true
        derivation: provider slice index (0 -> OUTBOUND, 1 -> INBOUND)
    invariants:
      schema_enforced:
        - ONE_WAY => every segment direction = OUTBOUND
        - ROUND_TRIP => segments[0].direction = OUTBOUND, >= 1 INBOUND, minItems 2
      domain_enforced:
        - ROUND_TRIP segment order is contiguous: all OUTBOUND then all INBOUND (not expressible in JSON Schema)
        - price, expires_at, baggage, sources are offer-level and cover all directions and passengers
    unchanged: [provider_offer_id, state, price, expires_at, baggage, bookable, sources, segment_time, offer_source]
  - id: SCH-OfferSnapshot / SCH-RepriceResult (v3.4) / SCH-TripRequestFlightSelection (v3.13)
    change: $ref target only -> proposed SCH-FlightOffer; semantics unchanged
  - id: SCH-OfferChangeSet (v3.3)
    change: none (D3 maps itinerary mismatch to UNVERIFIED)
  - id: SCH-FlightSearchCriteria (v3.12), SCH-TripRequest (v3.9), SCH-TripPlan/ItineraryItem (v3.16), SCH-OpportunityResult (v3.22)
    change: none

