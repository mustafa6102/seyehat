version: 3.2.2
roles:
- owner
- collaborator
- traveler
- traveler_data_viewer
- support_agent
- system_worker
policies:
- id: POLICY-TRIP-001
  condition: Kullanıcı trip kapsamındaki yetkili rolde olmalıdır.
  purpose: Trip verisine kapsamlı erişim.
  duration: OPEN
  audit_required: true
  decision_ref: null
  refs:
  - PLT-AUTH-001
- id: POLICY-TRAVELER-001
  condition: Traveler yalnız kendi verisine; owner başka yetişkinin hassas verisine
    ancak açık yetki/hukuki dayanak ile erişir.
  purpose: Yolcu profili yönetimi.
  duration: OPEN
  audit_required: true
  decision_ref: OD-013
  refs:
  - TRV-001
  - PLT-AUTH-001
  - PLT-PII-001
- id: POLICY-MINOR-001
  condition: Reşit olmayan yolcu için temsil/erişim kuralının hukuki ayrıntısı OPEN.
  purpose: Minör yolcu verisi yönetimi.
  duration: OPEN
  audit_required: true
  decision_ref: OD-013
  refs:
  - TRV-001
  - PLT-PII-001
- id: POLICY-PII-VIEW-001
  condition: Amaç, kapsam ve yetki doğrulanmalı; başka yetişkin PII erişimi OD-013
    sonucuna tabidir.
  purpose: Hassas PII görüntüleme.
  duration: OPEN
  audit_required: true
  decision_ref: OD-013
  refs:
  - PLT-AUTH-001
  - PLT-PII-001
- id: POLICY-SYSTEM-001
  condition: Yalnız gerekli background iş akışı ve least privilege.
  purpose: Sistem işi.
  duration: İşlem süresi
  audit_required: true
  decision_ref: null
  refs:
  - NFR-AUTH-001
- id: POLICY-KVKK-001
  condition: Export/delete kapsamı ve saklama istisnaları OD-013 ile kesinleşir.
  purpose: Hesap verisi dışa aktarma/silme.
  duration: OPEN
  audit_required: true
  decision_ref: OD-013
  refs:
  - PLT-PII-001
  - NFR-PRV-001
- id: POLICY-ACCOUNT-SELF-001
  condition: Kimliği doğrulanmış hesap sahibi yalnız kendi hesap verisi üzerinde işlem
    yapar. Saklama/silme istisnalarının hukuki ayrıntısı OD-013 ile kesinleşir.
  purpose: İlgili kişinin kendi hesap verisini dışa aktarma/silme hakkı.
  duration: İşlem süresi
  audit_required: true
  decision_ref: OD-013
  refs:
  - PLT-PII-001
  - NFR-PRV-001
  - POLICY-KVKK-001
- id: POLICY-SUBJECT-DELETE-001
  condition: Traveler kendi verisi için subject=self olmalıdır; minör için temsil
    kuralı POLICY-MINOR-001 ve OD-013 sonucuna tabidir.
  purpose: Traveler hassas verisi ve belge silme talebi.
  duration: İşlem süresi
  audit_required: true
  decision_ref: OD-013
  refs:
  - POLICY-MINOR-001
  - PLT-PII-001
